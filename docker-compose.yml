services:
  dropsend:
    build: .
    image: proelectro/dropsend:latest
    container_name: dropsend

    volumes:
      - ./uploads:/app/uploads

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dropsend-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - dropsend

    restart: unless-stopped
